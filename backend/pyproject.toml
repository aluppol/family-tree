[project]
name = "family-tree-backend"
version = "1.0.0"
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["family_tree/adapters/persistence/migrations"]

[tool.ruff.lint]
select = [
    "A", "ARG", "B", "BLE", "C4", "C90", "DTZ", "E", "EM", "ERA", "F", "FBT", "FURB", "I", "ISC", "N",
    "PERF", "PIE", "PL", "PT", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T20", "TC", "TRY", "UP", "W",
]
ignore = ["TRY003", "EM101", "EM102", "PLR2004", "TC001", "TC002", "TC003", "N818"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 8
max-returns = 4
max-statements = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "SLF001", "FBT001", "ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["family_tree/adapters/persistence/migrations/"]

[[tool.mypy.overrides]]
module = ["drf_spectacular.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["family_tree.api.schema"]
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-p tests.environment --strict-markers --strict-config -ra"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["family_tree", "config"]
omit = ["family_tree/adapters/persistence/migrations/*", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "class .*\\(Protocol\\):", "@overload"]
